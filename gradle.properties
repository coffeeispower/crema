# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# JVM args for the Gradle daemon itself. On JDK 23+ Gradle's native-platform
# library triggers restricted-method warnings (java.lang.System::load); these
# flags opt back in and silence them. (App/test JVM args live in the build
# scripts instead: `applicationDefaultJvmArgs` in app/build.gradle.kts and the
# kotlin-jvm convention plugin.)
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
