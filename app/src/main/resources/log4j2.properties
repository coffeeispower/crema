status = warn
monitorInterval = 1

# Console, visible on the TTY the compositor runs on.
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Session log, so the log survives the bare-TTY session and can be followed
# from the desktop (e.g. `tail -f ~/.local/share/jayland/jayland.log`).
# One file per session: on startup, LogArchiver gzips the previous session's
# log into a numbered archive and a fresh file starts at the normal path.
# The path comes straight from CrashReport.logFile via the
# JaylandLogFileLookup plugin; there is no duplicated default here. The
# parent directory is created on demand by log4j2.
appender.file.type = File
appender.file.name = SessionLog
appender.file.fileName = ${jaylandLogFile:path}
appender.file.createOnDemand = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

rootLogger.level = ${env:JAYLAND_LOG_LEVEL:-debug}
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = SessionLog
